title: fagob
author: Cristóbal Mejías
version: 0.1.0
quarto-required: ">=1.4.0"
# Basado en grantmcdermott/quarto-revealjs-clean (MIT), versión 1.4.1.
# clean.scss se mantiene sin cambios; las personalizaciones van en fagob.scss.
contributes:
  formats:
    revealjs:
      theme: [default, clean.scss, fagob.scss]
      filters:
        - secciones.lua
      menu:
        side: left
      slide-number: true
      transition: fade
      embed-resources: true
      date-format: "MMMM [de] YYYY"
      code-copy: true
      title-slide-attributes:
        data-background-color: "#40666e"
      html-math-method:
        method: mathjax
        url: "https://cdn.jsdelivr.net/npm/mathjax@4/tex-mml-chtml.js"
      include-before-body:
        - text: |
            <script src="mathjax-config.js"></script>
      format-resources:
        - mathjax-config.js
